{{define "comment"}}

<div class="py-0 border-s bg-black bg-opacity-50 shadow p-2 border-slate-50">
  <p class="text-sm text-slate-200">{{.Username}}</p>
  <div class="w-full my-2 p-1">
    <p class="text-slate-100 font-thin">{{ .Content }}</p>
  </div>
  <p class="text-slate-400 text-xs px-5 py-2">
    Posted: {{.CreatedAt | humanDate }}
  </p>
</div>

{{end}}
