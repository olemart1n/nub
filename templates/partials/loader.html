{{define "loader"}}

<div
  id="loader"
  class="hidden space-x-2 justify-center mx-auto items-center h-screen max-h-4"
>
  <span class="sr-only">Loading...</span>
  <div
    class="h-2 w-2 bg-yellow-400 rounded-full animate-bounce [animation-delay:-0.3s]"
  ></div>
  <div
    class="h-2 w-2 bg-yellow-400 rounded-full animate-bounce [animation-delay:-0.15s]"
  ></div>
  <div class="h-2 w-2 bg-yellow-400 rounded-full animate-bounce"></div>
</div>
{{end}}
